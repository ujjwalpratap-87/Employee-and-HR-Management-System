rel="stylesheet">

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="container-fluid">

<div class="row">

<div class="col-md-3 col-lg-2 p-0 sidebar">

<div class="sidebar-brand">

<h4>Employee & HR</h4>

<small>Management System</small>

Logout

</div>

</div>


<div class="col-md-9 col-lg-10 p-0">

<div class="topbar">

<strong>
My Profile
</strong>

<div class="user-info">

<span>
Ujjwal Pratap Singh
</span>

<div class="avatar">
US
</div>

</div>

</div>


<div class="main-content">

<h2 class="page-title">
Profile
</h2>

<p class="page-subtitle">
View and update employee information.
</p>


<div class="profile-header mb-4">

<div class="d-flex align-items-center gap-3">

<div class="profile-avatar">
US
</div>

<div>

<h3>
Ujjwal Pratap Singh
</h3>

<p class="text-muted mb-0">
Employee ID: EMP001
</p>

</div>

</div>

</div>


<div class="form-card">

<h4 class="mb-4">
Personal Information
</h4>

<form>

<div class="row g-3">

<div class="col-md-6">

<label class="form-label">
Full Name
</label>

<input
type="text"
class="form-control"
value="Ujjwal Pratap Singh">

</div>


<div class="col-md-6">

<label class="form-label">
Employee ID
</label>

<input
type="text"
class="form-control"
value="EMP001"
readonly>

</div>


<div class="col-md-6">

<label class="form-label">
Department
</label>

<input
type="text"
class="form-control"
value="Computer Engineering">

</div>


<div class="col-md-6">

<label class="form-label">
Designation
</label>

<input
type="text"
class="form-control"
value="Employee">

</div>


<div class="col-md-6">

<label class="form-label">
Email
</label>

<input
type="email"
class="form-control"
placeholder="Enter email">

</div>


<div class="col-md-6">

<label class="form-label">
Contact
</label>

<input
type="text"
class="form-control"
placeholder="Enter contact">

</div>


<div class="col-md-6">

<label class="form-label">
Joining Date
</label>

<input
type="date"
class="form-control">

</div>


<div class="col-md-6">

<label class="form-label">
Status
</label>

<select class="form-select">

<option>
Active
</option>

<option>
Inactive
</option>

</select>

</div>


<div class="col-12">

<label class="form-label">
Address
</label>

<textarea
class="form-control"
rows="4"
placeholder="Enter address">
</textarea>

</div>

</div>


<button
type="submit"
class="btn btn-primary mt-4">

Update Profile

</button>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
